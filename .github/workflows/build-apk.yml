name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Capacitor Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Build Artifacts
        run: |
          echo "Verifying web build outputs in dist/..."
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not generated!"
            exit 1
          fi
          if [ ! -f "dist/audio/hawayein.mp3" ]; then
            echo "ERROR: dist/audio/hawayein.mp3 is missing!"
            exit 1
          fi
          echo "Web build verified successfully."

      - name: Sync Capacitor Android Platform
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: android platform directory is missing from repository!"
            exit 1
          fi
          npx cap sync android

      - name: Verify Android Packaged Assets
        run: |
          echo "Verifying Android assets in android/app/src/main/assets/public/..."
          if [ ! -f "android/app/src/main/assets/public/index.html" ]; then
            echo "ERROR: android/app/src/main/assets/public/index.html missing after cap sync!"
            exit 1
          fi
          if [ ! -f "android/app/src/main/assets/public/audio/hawayein.mp3" ]; then
            echo "ERROR: android/app/src/main/assets/public/audio/hawayein.mp3 missing after cap sync!"
            exit 1
          fi
          echo "Android assets verified successfully."

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify Generated APK
        run: |
          APK_FILE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "ERROR: Expected APK output at $APK_FILE not found!"
            exit 1
          fi
          echo "Successfully verified built APK: $(ls -lh $APK_FILE)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: our-little-story-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Compatibility APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat-love-counter-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
